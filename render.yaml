services:
  - type: web
    name: firelink
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-deploy.txt
    startCommand: python run_all.py --no-fetch --host 0.0.0.0
    envVars:
      - key: FIRMS_MAP_KEY
        sync: false          # set the value in the Render dashboard, never in the repo
      - key: PYTHON_VERSION
        value: "3.12.6"
